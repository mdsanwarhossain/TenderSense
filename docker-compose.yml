version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tendersense-db
    environment:
      POSTGRES_DB: tendersense
      POSTGRES_USER: tendersense
      POSTGRES_PASSWORD: tendersense
    # 5433 on the host: the developer machine already runs a local Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - tendersense-pgdata:/var/lib/postgresql/data
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tendersense -d tendersense"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Local LLM for the second-stage tender review (CPU-only on this machine). The model
  # lives in the named volume, so it is pulled once:
  #   docker exec tendersense-ollama ollama pull qwen2.5:7b
  ollama:
    image: ollama/ollama:0.34.0
    container_name: tendersense-ollama
    ports:
      - "11434:11434"
    volumes:
      - tendersense-ollama:/root/.ollama

volumes:
  tendersense-pgdata:
  tendersense-ollama:
