@if (company()) {
<div class="shell">
  <aside class="rail">
    <a class="brand" routerLink="/shortlist">
      <span class="brand-mark" aria-hidden="true">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l7.5 4.3v9.4L12 21l-7.5-4.3V7.3z" /><circle cx="12" cy="12" r="2.6" />
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">TenderSense</span>
        <span class="brand-sub">Bid intelligence</span>
      </span>
    </a>

    <nav class="rail-nav" aria-label="Sections">
      <span class="rail-label">Working set</span>
      <a class="rail-link" routerLink="/shortlist" routerLinkActive="on">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16" /><path d="M4 12h10" /><path d="M4 18h7" /><circle cx="18.5" cy="16.5" r="3" />
        </svg>
        <span class="grow">Tender list</span>
      </a>

      <span class="rail-label">Evidence</span>
      <!-- The benchmark page still exists at /benchmark: a developer check, not for users. -->
      <a class="rail-link" routerLink="/profile" routerLinkActive="on">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" />
        </svg>
        <span class="grow">Profile</span>
      </a>
      <a class="rail-link" routerLink="/pipeline" routerLinkActive="on">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7h6l2 3h10" /><path d="M3 17h8l2-3h8" />
        </svg>
        <span class="grow">Pipeline</span>
      </a>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="greet">
        <h1>{{ section().title }}</h1>
        <span class="sub">{{ section().sub }}</span>
      </div>
      <div class="topbar-right">
        <ts-notification-bell />
        <ts-account-menu />
      </div>
    </header>

    <main class="page">
      <router-outlet />
    </main>
  </div>
</div>
} @else {
  <!-- Signed out, or still asking: /login and /signup paint their own full page. -->
  <router-outlet />
}
