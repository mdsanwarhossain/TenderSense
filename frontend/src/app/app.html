@if (user()) {
<div class="shell">
  <aside class="rail">
    <a class="brand" [routerLink]="home()">
      <img class="brand-logo" src="bracit-tendersense-logo.png" alt="BRAC IT TenderSense" />
    </a>

    <nav class="rail-nav" aria-label="Sections">
      <!-- The company's own screens. A platform admin has no company, so none of these. -->
      @if (company()) {
        <span class="rail-label">Working set</span>
        <a class="rail-link" routerLink="/dashboard" routerLinkActive="on">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.5" y="3.5" width="7" height="8" rx="1.5" /><rect x="13.5" y="3.5" width="7" height="5" rx="1.5" />
            <rect x="13.5" y="11.5" width="7" height="9" rx="1.5" /><rect x="3.5" y="14.5" width="7" height="6" rx="1.5" />
          </svg>
          <span class="grow">Dashboard</span>
        </a>
        <a class="rail-link" routerLink="/shortlist" routerLinkActive="on">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6h16" /><path d="M4 12h10" /><path d="M4 18h7" /><circle cx="18.5" cy="16.5" r="3" />
          </svg>
          <span class="grow">Tender list</span>
        </a>
        <!-- The benchmark page still exists at /benchmark: a developer check, not for users. -->
        <a class="rail-link" routerLink="/profile" routerLinkActive="on">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" />
          </svg>
          <span class="grow">Profile</span>
        </a>
      }

      @if (isAdmin()) {
        <span class="rail-label">Admin</span>
        <a class="rail-link" routerLink="/admin" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: true }">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 20h18" /><path d="M6 16v-5" /><path d="M11 16V7" /><path d="M16 16v-8" /><path d="M20 16v-3" />
          </svg>
          <span class="grow">Overview</span>
        </a>
        <a class="rail-link" routerLink="/admin/tenders" routerLinkActive="on">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6h16" /><path d="M4 12h16" /><path d="M4 18h10" />
          </svg>
          <span class="grow">Tenders</span>
        </a>
        <a class="rail-link" routerLink="/admin/companies" routerLinkActive="on">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 21V6l7-3v18" /><path d="M11 9h9v12" /><path d="M7 8h1M7 12h1M7 16h1M15 13h1M15 17h1" />
          </svg>
          <span class="grow">Companies</span>
        </a>
        <a class="rail-link" routerLink="/admin/users" routerLinkActive="on">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="8" r="3.5" /><path d="M2.5 20a6.5 6.5 0 0 1 13 0" /><path d="M16 4.5a3.5 3.5 0 0 1 0 7" /><path d="M18.5 14.5A6.5 6.5 0 0 1 21.5 20" />
          </svg>
          <span class="grow">Users</span>
        </a>
        <a class="rail-link" routerLink="/admin/pipeline" routerLinkActive="on">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7h6l2 3h10" /><path d="M3 17h8l2-3h8" />
          </svg>
          <span class="grow">Pipeline</span>
        </a>
        <a class="rail-link" routerLink="/admin/scheduler" routerLinkActive="on">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.5" y="5" width="17" height="15.5" rx="2" /><path d="M3.5 10h17" /><path d="M8 3v4M16 3v4" />
            <path d="M12 13.2v2.6l1.8 1.1" />
          </svg>
          <span class="grow">Scheduler</span>
        </a>
      }
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="greet">
        <h1>{{ section().title }}</h1>
        <span class="sub">{{ section().sub }}</span>
      </div>
      <div class="topbar-right">
        <!-- New-match alerts are per company; staff accounts have none. -->
        @if (company()) {
          <ts-notification-bell />
        }
        <ts-account-menu />
      </div>
    </header>

    <main class="page">
      <router-outlet />
    </main>
  </div>
</div>
} @else {
  <!-- Signed out, or still asking: /login and /signup paint their own full page. -->
  <router-outlet />
}
