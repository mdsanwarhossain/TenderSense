server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keeps the browser's session cookie same-origin: the backend never sees a
    # cross-origin request, so no CORS/SameSite handling is needed for auth.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: fall back to index.html for deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
