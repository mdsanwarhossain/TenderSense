# The local model reads open tenders between the staging table and the tender table.
# Needs the native Ollama install running with the model pulled: ollama pull qwen2.5:7b
# If the backend itself runs in a container, point tendersense.llm.base-url at
# http://host.docker.internal:11434 (add "extra_hosts: host.docker.internal:host-gateway"
# to the backend service on Linux) instead of the localhost default.
tendersense.llm.enabled=true
tendersense.processing.enabled=true
