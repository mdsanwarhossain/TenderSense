spring.application.name=TenderSense
server.port=8080

# --- Datasource -------------------------------------------------------------
# pgvector runs on 5433: this machine already has a local Postgres on 5432.
spring.datasource.url=jdbc:postgresql://localhost:5433/tendersense
spring.datasource.username=tendersense
spring.datasource.password=tendersense
spring.datasource.driver-class-name=org.postgresql.Driver

# `update`, not `create`: a company that signs up through the product exists only in
# this database, and `create` deletes it on the next boot along with the scored corpus.
# Additive only -- it never drops a column, so a removed mapping leaves the old one
# behind until someone migrates it by hand.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Dhaka

# --- Vector store -----------------------------------------------------------
# 384 dimensions = all-MiniLM-L6-v2, the local ONNX model. Changing the embedding
# model means changing this number AND re-scoring every tender.
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=384

# --- Ingestion --------------------------------------------------------------
tendersense.egp.base-url=https://www.eprocure.gov.bd
tendersense.egp.listing-path=/resources/common/AllTenders.jsp?h=t
tendersense.egp.detail-path=/resources/common/ViewTender.jsp
# Politeness: 1 request/second against a government portal. Do not raise this.
tendersense.egp.detail-delay-ms=1000
tendersense.egp.headless=true
# Discovery stops after this many consecutive already-known tender IDs (2 pages).
tendersense.egp.discovery-stop-after-known=20
tendersense.egp.snapshot-dir=data/snapshots/egp

tendersense.worldbank.api-url=https://search.worldbank.org/api/v2/procnotices
# NOTE: countryname_exact / cntry_exact are silently ignored by the API and return
# the unfiltered total. project_ctry_name_exact is the parameter that actually works.
tendersense.worldbank.country=Bangladesh
tendersense.worldbank.page-size=100

# --- Scheduling (all cron expressions are Asia/Dhaka) -----------------------
tendersense.schedule.enabled=true
tendersense.schedule.zone=Asia/Dhaka
# Every 30 min during Bangladesh business hours. Cheap: 1-3 listing pages.
tendersense.schedule.egp-discovery=0 0/30 8-20 * * *
# Nightly full crawl -- the only thing that sees corrigenda on stored tenders.
tendersense.schedule.egp-reconcile=0 0 2 * * *
# JSON API, so this costs seconds.
tendersense.schedule.world-bank-sync=0 15 */6 * * *
# The BRD deliverable: the shortlist lands at the start of the working day.
tendersense.schedule.morning-digest=0 0 8 * * *
# No detail-drain job: detail pages are fetched inline for the ids discovery finds.
# No urgency-refresh job: days-to-deadline is derived on read, never stored.

# --- Matching ---------------------------------------------------------------
tendersense.matching.chunk-size=512
tendersense.matching.chunk-overlap=64
tendersense.matching.top-evidence=3

# --- Summaries --------------------------------------------------------------
# Empty key => TemplateSummaryServiceImpl is used. Set to enable the LLM writer.
tendersense.summary.api-key=
tendersense.summary.enabled=false

logging.level.com.bracit.tendersense=INFO

# --- auth -------------------------------------------------------------------
# Demo-grade sign-in: a session attribute plus BCrypt hashes. No CSRF tokens, no
# rate limiting, no password reset. Do not put real customer data behind this.
# Password applied to the two companies seeded from data/capability-profile*.json.
# A company created through sign-up chooses its own and never uses this.
tendersense.auth.demo-password=tendersense
# Lets a request name its company with an X-Org-Id header instead of signing in.
# MUST stay false outside tests -- it bypasses authentication entirely.
tendersense.auth.allow-header=false

# --- second-stage LLM scoring (local Ollama) ---------------------------------
# Pins MiniLM as the embedding model. The Ollama starter registers an EmbeddingModel of
# its own; without this selector both activate and every EmbeddingModel injection fails.
spring.ai.model.embedding=transformers
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=http://localhost:11434
# Never pull a 4.7 GB model during startup. Pull it once: ollama pull qwen2.5:7b
spring.ai.ollama.init.pull-model-strategy=never
# Spring AI retries 10 times with x5 backoff by default, so an unreachable Ollama would
# stall one call for minutes. OllamaLlmMatchScorer owns the retry policy instead.
spring.ai.retry.max-attempts=1
# Only Spring AI uses Boot's shared RestClient.Builder here -- scraping builds its own
# clients -- so these reach the Ollama calls and nothing else. CPU inference is slow;
# a refused connection should still fail fast.
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=180s

# Off by default so no test context ever calls a model. On in the demo profile.
tendersense.llm.enabled=false
tendersense.llm.model=qwen2.5:7b
# Shortlist page one -- the same 25 rows the morning shortlist shows first.
tendersense.llm.top-n=25
# Ollama's default context is small, and an overflowing prompt is cut from the FRONT,
# which is where the company profile sits. 8192 fits profile + tender with room to spare.
tendersense.llm.num-ctx=8192
tendersense.llm.max-attempts=2
tendersense.llm.seed=42
