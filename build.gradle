plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bracit'
version = '0.0.1-SNAPSHOT'
description = 'TenderSense'

java {
    toolchain {
        // JDK 21 (~/.jdks/ms-21.0.8). Note: JAVA_HOME on this machine points at a
        // deleted openjdk-25 directory, so builds need JAVA_HOME overridden or
        // org.gradle.java.home set in gradle.properties.
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext {
    springAiVersion = '2.0.1'
    seleniumVersion = '4.48.0'
    jsoupVersion = '1.23.2'
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

dependencies {
    // Just the crypto artifact -- BCryptPasswordEncoder and nothing else.
    // The full framework would bring a filter chain this app does not want.
    implementation 'org.springframework.security:spring-security-crypto'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Local ONNX embeddings (all-MiniLM-L6-v2): no API key, no network, runs in-JVM.
    implementation 'org.springframework.ai:spring-ai-starter-model-transformers'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'

    // e-GP ingestion: Selenium drives the JS-rendered listing, Jsoup parses detail pages.
    implementation "org.seleniumhq.selenium:selenium-java:${seleniumVersion}"
    implementation "org.jsoup:jsoup:${jsoupVersion}"

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// --- Angular ---------------------------------------------------------------
// Builds the frontend and copies it into static/ so `bootRun` serves one origin
// with no proxy and no CORS. Run `./gradlew ngBuild bootRun` for the demo build.
def frontendDir = file('frontend')
def frontendOut = file('src/main/resources/static')

// Angular 21 needs Node >= 20.19, and a machine's default node is often older --
// Gradle's Exec does not read a shell's `nvm use`, so it would silently pick the
// wrong one and fail with a version message. Resolve the version in frontend/.nvmrc
// out of ~/.nvm ourselves and put it first on PATH.
def nodeBinDir = {
    def nvmrc = file('frontend/.nvmrc')
    if (!nvmrc.exists()) {
        return null
    }
    def wanted = nvmrc.text.trim().replaceFirst(/^v/, '')
    def versions = file("${System.getProperty('user.home')}/.nvm/versions/node")
    if (!versions.isDirectory()) {
        return null
    }
    // .nvmrc may name a partial version (20 / 20.19); take the newest match.
    def match = versions.listFiles()
            .findAll { it.isDirectory() && (it.name == "v${wanted}" || it.name.startsWith("v${wanted}.")) }
            .max { a, b -> compareVersions(a.name, b.name) }
    return match == null ? null : new File(match, 'bin')
}

static int compareVersions(String a, String b) {
    def pa = a.replaceFirst(/^v/, '').split(/\./)*.toInteger()
    def pb = b.replaceFirst(/^v/, '').split(/\./)*.toInteger()
    for (int i = 0; i < Math.max(pa.size(), pb.size()); i++) {
        int c = (i < pa.size() ? pa[i] : 0) <=> (i < pb.size() ? pb[i] : 0)
        if (c != 0) {
            return c
        }
    }
    return 0
}

def useResolvedNode = { Exec task ->
    def bin = nodeBinDir()
    if (bin != null) {
        task.environment 'PATH', "${bin.absolutePath}${File.pathSeparator}${System.getenv('PATH')}"
    }
}

tasks.register('ngInstall', Exec) {
    description = 'Installs frontend dependencies'
    workingDir frontendDir
    commandLine 'npm', 'ci'
    onlyIf { !file('frontend/node_modules').exists() }
    doFirst { useResolvedNode(it) }
}

tasks.register('ngCompile', Exec) {
    description = 'Produces a production Angular bundle'
    dependsOn 'ngInstall'
    workingDir frontendDir
    commandLine 'npx', 'ng', 'build', '--configuration', 'production'
    inputs.dir file('frontend/src')
    inputs.file file('frontend/package.json')
    outputs.dir file('frontend/dist')
    doFirst { useResolvedNode(it) }
}

tasks.register('ngBuild', Copy) {
    description = 'Copies the Angular bundle into the Spring static resources'
    dependsOn 'ngCompile'
    // Angular 17+ emits the browser bundle under dist/<project>/browser.
    from file('frontend/dist/frontend/browser')
    into frontendOut
}

tasks.register('ngClean', Delete) {
    delete frontendOut
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:deprecation'
}

tasks.named('test') {
    useJUnitPlatform()
}
